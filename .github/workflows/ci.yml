# Hardened continuous integration workflow for TotalDrop for Windows 11 (ADR 0016).
# Enforces least-privilege permissions, 40-character SHA-pinned actions, digest-pinned
# container images, native x64 + ARM64 matrix verification, MSVC release builds,
# real x64 .NET 10 Native AOT WinUI 3 + MakePri + strict makeappx MSIX build & deep
# verification, static asset/version/resw checks, cargo-deny, REUSE 3.3, and gitleaks.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-bridge:
    name: Rust bridge (${{ matrix.arch }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: win-x64
          - os: windows-11-arm
            arch: win-arm64
          - os: ubuntu-latest
            arch: linux-x64
          - os: ubuntu-24.04-arm
            arch: linux-arm64
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "$MATRIX_OS" = "windows-11-arm" ]; then
            rustup target add aarch64-pc-windows-msvc
          elif [ "$MATRIX_OS" = "windows-latest" ]; then
            rustup target add x86_64-pc-windows-msvc
          fi
      - name: Format
        if: runner.os == 'Linux'
        shell: bash
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        shell: bash
        env:
          TOTALDROP_REQUIRE_IPV6: "1"
        run: cargo test --workspace --locked
      - name: Build native ARM64 totaldrop-windows-ffi cdylib release
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: >-
          env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS
          cargo build
          --config target-arm64/cargo-config.toml
          --target aarch64-pc-windows-msvc
          -p totaldrop-windows-ffi
          --release
          --locked

  static-checks:
    name: Static assets, versions & l10n parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure Pillow is installed for Kose asset verification
        run: >-
          python3 -c "import PIL" 2>/dev/null ||
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-pil)
      - name: Verify version alignment & canonical CLSID
        run: python3 tools/check-versions.py
      - name: Verify 46 deterministic Kose MSIX assets & TotalDrop.ico
        run: python3 tools/render-windows-assets.py --check
      - name: Verify 35-locale .resw and AppxManifest parity
        run: python3 tools/check-resw-parity.py --check
      - name: Verify 6 isolated sub-platform x CPU units
        run: python3 tools/verify-subplatforms.py

  windows-msvc-targets:
    name: Windows MSVC targets & manifests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python 3.12 (x64)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install the pinned Rust toolchain and MSVC targets
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - name: Build totaldrop-windows-bridge & FFI cdylib release (x86_64-pc-windows-msvc)
        shell: bash
        run: >-
          env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS
          cargo build
          --config target-x86_64/cargo-config.toml
          --target x86_64-pc-windows-msvc
          -p totaldrop-windows-bridge
          -p totaldrop-windows-ffi
          --release
          --locked
      - name: Build totaldrop-windows-bridge & check FFI (aarch64-pc-windows-msvc)
        shell: bash
        run: |
          env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS \
            cargo build \
            --config target-arm64/cargo-config.toml \
            --target aarch64-pc-windows-msvc \
            -p totaldrop-windows-bridge \
            --release \
            --locked
          env -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS \
            cargo check \
            --config target-arm64/cargo-config.toml \
            --target aarch64-pc-windows-msvc \
            -p totaldrop-windows-ffi \
            --release \
            --locked
      - name: Validate PowerShell AST syntax
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $scripts = @(
            'target-x86_64/build-x64.ps1',
            'target-arm64/build-arm64.ps1'
          )
          foreach ($script in $scripts) {
            $fullPath = (Resolve-Path -LiteralPath $script).Path
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile($fullPath, [ref]$tokens, [ref]$errors)
            if ($null -eq $ast -or $errors.Count -gt 0) {
              foreach ($err in $errors) {
                Write-Error $err.ToString()
              }
              throw "PowerShell AST syntax validation failed for $script"
            }
            Write-Host "PowerShell AST OK: $script ($($tokens.Count) tokens)"
          }
      - name: Validate XML well-formedness (.xaml, .appxmanifest, app.manifest, and 35-locale .resw)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $xmlFiles = @(git ls-files '*.xaml' '*.appxmanifest' '*.resw' 'ui-winui3-fluent2/app.manifest')
          if ($LASTEXITCODE -ne 0 -or $xmlFiles.Count -lt 38) {
            throw "Expected tracked .xaml, .appxmanifest, app.manifest, and 35 .resw files (found $($xmlFiles.Count))"
          }
          foreach ($relPath in $xmlFiles) {
            $fullPath = (Resolve-Path -LiteralPath $relPath).Path
            $doc = [System.Xml.XmlDocument]::new()
            $doc.XmlResolver = $null
            $doc.Load($fullPath)
          }
          Write-Host "XML OK: $($xmlFiles.Count) files validated (including 35 WinUI 3 .resw locales)"
      - name: Verify sub-platforms, versions & .resw parity on Windows
        shell: bash
        run: |
          python tools/verify-subplatforms.py
          python tools/check-versions.py
          python tools/check-resw-parity.py --check

  windows-x64-msix:
    name: Windows x64 Native AOT & MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python 3.12 (x64)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
      - name: Setup .NET 10 LTS SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Confirm active .NET 10 LTS SDK
        shell: pwsh
        run: |
          Push-Location ui-winui3-fluent2
          try {
            $ver = dotnet --version
            Write-Host "Active dotnet SDK: $ver"
            if ($ver -notlike "10.0.*") {
              throw "Expected .NET 10.0.x LTS SDK, got '$ver'"
            }
          }
          finally {
            Pop-Location
          }
      - name: Build x64 FFI cdylib, Native AOT WinUI 3, resources.pri & self-signed test MSIX
        shell: pwsh
        run: pwsh -NoProfile -File .\target-x86_64\build-x64.ps1 -SelfSignEphemeral
      - name: Verify subplatform MSIX OPC/ZIP & SHA256SUMS
        shell: bash
        run: sh subplatforms/msix/x86_64/verify.sh dist
      - name: Deep-verify MSIX contents, PRI dump, PE32+ hardening, CRT isolation & live C ABI
        shell: bash
        run: >-
          python tools/verify-msix-artifact.py
          --msix dist/TotalDrop_0.1.1.0_x64.msix
          --arch x64
          --expected-version 0.1.1.0
          --expect-signed
          --pri-dump dist/work-x64/pri-work-x64/resources-x64.pri.xml
      - name: Verify ephemeral Authenticode signature on test MSIX
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $msix = (Resolve-Path -LiteralPath "dist\TotalDrop_0.1.1.0_x64.msix").Path
          $sig = Get-AuthenticodeSignature -FilePath $msix
          Write-Host "Authenticode Status: $($sig.Status)"
          Write-Host "Authenticode StatusMessage: $($sig.StatusMessage)"
          if ($null -eq $sig.SignerCertificate) {
            throw "MSIX is not signed (SignerCertificate is null)."
          }
          Write-Host "Authenticode Subject: $($sig.SignerCertificate.Subject)"
          Write-Host "Authenticode Algorithm: $($sig.SignerCertificate.SignatureAlgorithm.FriendlyName)"
          if ($sig.SignerCertificate.Subject -ne "CN=TotalDrop") {
            throw "Expected Subject 'CN=TotalDrop', got '$($sig.SignerCertificate.Subject)'."
          }
          if ($sig.SignerCertificate.SignatureAlgorithm.FriendlyName -notmatch "sha256") {
            throw "Expected SHA-256 signature algorithm, got '$($sig.SignerCertificate.SignatureAlgorithm.FriendlyName)'."
          }
          if ($sig.Status -in @("NotSigned", "HashMismatch", "NotSupportedFileFormat")) {
            throw "Invalid Authenticode signature status: $($sig.Status) ($($sig.StatusMessage))"
          }
          if ($sig.Status -ne "Valid" -and -not ($sig.Status -eq "UnknownError" -and $sig.StatusMessage -match "not trusted|root certificate|untrusted")) {
            throw "Unexpected Authenticode signature status: $($sig.Status) ($($sig.StatusMessage))"
          }
      - name: Upload x64 test MSIX artifact & SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: totaldrop-windows-x64-test-msix
          path: |
            dist/TotalDrop_0.1.1.0_x64.msix
            dist/SHA256SUMS
          if-no-files-found: error

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"

  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source files carry SPDX lines
        run: ./tools/check-spdx.sh
      - name: reuse lint
        run: >-
          docker run --rm --volume "$PWD:/data"
          fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
          lint

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case $EVENT in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            merge_group) base=$MERGE_GROUP_BASE ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            range=$base..HEAD
          else
            base=HEAD range=HEAD
          fi
          echo "Scanning $range"
          { echo "BASE=$base"; echo "RANGE=$range"; } >>"$GITHUB_ENV"
      - name: No signing keys, key.properties or .gitleaksignore
        run: |
          found=$(
            { git ls-files -z
              git -c core.quotePath=false log --format= --name-only -z --no-renames --diff-filter=d "$RANGE"
            } | grep -ziE '(^|/)(key\.properties|\.gitleaksignore)$|\.(jks|keystore|p12|pfx|pepk|snk)$' | tr '\0' '\n' | sort -u
          )
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Signing keys, key.properties, and .gitleaksignore must not be committed."
            exit 1
          fi
      - name: gitleaks
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        run: |
          cfg=$RUNNER_TEMP/gitleaks
          mkdir -p "$cfg"
          if ! git show "$BASE:.gitleaks.toml" >"$cfg/gitleaks.toml" 2>/dev/null; then
            printf '[extend]\nuseDefault = true\n' >"$cfg/gitleaks.toml"
          fi
          docker run --rm --volume "$PWD/.git:/repo/.git:ro" --volume "$cfg:/cfg:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact --verbose --config /cfg/gitleaks.toml \
            --gitleaks-ignore-path /cfg --ignore-gitleaks-allow \
            --log-opts="--text $RANGE" /repo

  gate:
    name: CI
    if: always()
    needs: [rust-bridge, static-checks, windows-msvc-targets, windows-x64-msix, deny, reuse, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
