#
# Dedicated sub-platform x CPU cloud packaging & Sigstore provenance workflow
# for `windows-msix-arm64` (`totaldrop-windows`, ADR 0020).
name: Package (msix / arm64)

on:
  push:
    tags:
      - "windows-msix-arm64-v*"
  pull_request:
    paths:
      - "subplatforms/msix/arm64/**"
      - ".github/workflows/pkg-msix-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg-msix-arm64-${{ github.ref }}
  cancel-in-progress: "${{ !startsWith(github.ref, 'refs/tags/') }}"

jobs:
  package:
    name: Build & Verify (msix / arm64)
    runs-on: windows-11-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python 3.12 (arm64)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Validate isolated sub-platform recipe (windows-msix-arm64)
        shell: bash
        run: |
          sh subplatforms/msix/arm64/build.sh --check-recipe
          sh subplatforms/msix/arm64/verify.sh --check-recipe
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-pc-windows-msvc
      - name: Setup .NET 10 LTS SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build & verify real arm64 MSIX package and SHA256SUMS
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1760000000"
          TOTALDROP_SELF_SIGN_EPHEMERAL: "${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}"
        run: |
          out_dir="$RUNNER_TEMP/dist-msix-arm64"
          mkdir -p "$out_dir"
          sh subplatforms/msix/arm64/build.sh "$out_dir"
          sh subplatforms/msix/arm64/verify.sh "$out_dir"
      - name: Upload sub-platform artifact & SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msix-arm64
          path: |
            ${{ runner.temp }}/dist-msix-arm64/TotalDrop_0.1.1.0_arm64.msix
            ${{ runner.temp }}/dist-msix-arm64/SHA256SUMS
          if-no-files-found: error
      - name: Attest Sigstore OIDC build provenance on release tags
        if: startsWith(github.ref, 'refs/tags/windows-msix-arm64-v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist-msix-arm64/TotalDrop_0.1.1.0_arm64.msix
