# Copyright and license of the files that cannot carry them in a comment
# (JSON, translations, lockfiles) or build and configuration files.
# Source files carry their own SPDX lines; the REUSE tool checks both
# (`reuse lint`, in CI).
version = 1

# Everything not listed below: the Windows app, packaging, scripts, and CI.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The protocol libraries, Windows bridge/FFI crates, and the translations that
# totaldrop-l10n compiles into itself.
[[annotations]]
path = [
  "crates/totaldrop-crypto/**",
  "crates/totaldrop-proto/**",
  "crates/totaldrop-core/**",
  "crates/totaldrop-l10n/**",
  "crates/totaldrop-windows-bridge/**",
  "crates/totaldrop-windows-ffi/**",
  "l10n/**",
  "ui-winui3-fluent2/Strings/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Generated Kose MSIX visual assets and Win32 application icon (`tools/render-windows-assets.py`).
[[annotations]]
path = "ui-winui3-fluent2/Assets/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
